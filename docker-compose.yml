version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: dummy
      POSTGRES_PASSWORD: dummy
      POSTGRES_DB: dummy
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "1234:1234"
    environment:
      - DATABASE_URL=postgresql://dummy:dummy@db:5432/dummy
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - AUTH_SECRET=dummy
      - GEMINI_API_KEY=dummy
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - STRIPE_API_KEY=dummy
      - STRIPE_WEBHOOK_SECRET=dummy
      - NEXT_PUBLIC_STRIPE_PRO_MONTHLY_PLAN_ID=dummy
    depends_on:
      - db
      - redis
