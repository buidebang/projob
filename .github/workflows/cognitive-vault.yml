- name: 🚀 Commit & Push to Target Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 🚨 عملیات پاکسازی: حذف تمام پوشه‌های گیت متداخل و فایل‌های ساب‌ماژول 
          echo "Sanitizing downloaded repositories to prevent Git index corruption..."
          find lib/cognitive-vault/cache/ -name ".git" -type d -exec rm -rf {} +
          find lib/cognitive-vault/cache/ -name ".gitmodules" -type f -delete
          find lib/cognitive-vault/cache/ -name ".gitignore" -type f -delete
          
          # اضافه کردن فایل‌های دانلود شده‌ی کاملاً تمیز
          git add lib/cognitive-vault/cache/
          
          # کامیت کردن در صورت وجود تغییرات
          git commit -m "feat(cognitive-vault): 🧠 auto-ingest and sanitize latest SOTA system prompts" || echo "No new prompts to update."
          
          # پوش کردن مستقیم به برنچ هدف
          git push origin HEAD:feature/live-defai-synthesis-746394341309428353
