name: Force Fetch AI Modules to Jules Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  force-clone-and-push:
    runs-on: ubuntu-latest
    steps:
      # ۱. قفل کردن مستقیم روی برنچ ژول (مهم‌ترین بخش)
      - name: Checkout Target Branch
        uses: actions/checkout@v4
        with:
          ref: 'jules-phase-21-7311651716489553050-14601153819120041594'

      # ۲. ساخت پوشه در برنچ ژول
      - name: Create Reference Directory
        run: mkdir -p ai_reference_modules

      # ۳. دانلود پروژه‌ها
      - name: Clone Rowboat
        run: git clone https://github.com/rowboatlabs/rowboat.git ai_reference_modules/rowboat || true

      - name: Clone Shadcn Improve
        run: git clone https://github.com/shadcn/improve.git ai_reference_modules/improve || true

      - name: Clone Graphify
        run: git clone https://github.com/Graphify-Labs/graphify.git ai_reference_modules/graphify || true

      - name: Clone Skillscript
        run: git clone https://github.com/sshwarts/skillscript.git ai_reference_modules/skillscript || true

      - name: Clone Grok-build
        run: git clone https://github.com/xai-org/grok-build.git ai_reference_modules/grok-build || true

      - name: Clone TryAI Music Video Arena
        run: git clone https://github.com/hershalb/music-video-arena.git ai_reference_modules/tryai-arena || true

      # ۴. پاک کردن فایل‌های مخفی گیت
      - name: Remove Git Submodules & Clean Up
        run: |
          find ai_reference_modules -name ".git" -type d -exec rm -rf {} +

      # ۵. کامیت و پوش کردن با قفل روی اسم برنچ ژول
      - name: Commit and Push to Jules Branch
        run: |
          git config --global user.name "AI Module Fetcher"
          git config --global user.email "bot@projob.ai"
          git add ai_reference_modules/
          git commit -m "chore: force fetch open-source AI reference modules for Jules" || echo "No changes to commit"
          git push origin HEAD:jules-phase-21-7311651716489553050-14601153819120041594
